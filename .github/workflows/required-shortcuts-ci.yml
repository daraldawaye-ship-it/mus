name: Required Shortcuts CI
on:
  push:
    branches: [preview/render-2026-10-23]
    paths:
      - "apps/api/src/services/required-shortcuts.ts"
      - "apps/api/src/routes-shortcuts.ts"
      - "apps/web/src/UserShortcuts.tsx"
      - "tests/required-shortcuts.test.ts"
      - ".github/workflows/required-shortcuts-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  required-shortcuts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/required-shortcuts.test.ts
