name: Legacy Dar Al-Dawa sales quantity signs
on:
  pull_request:
    paths:
      - 'apps/api/src/services/transaction-import.ts'
      - 'apps/api/src/services/legacy-sales-quantity.ts'
      - 'tests/legacy-sales-quantity.test.ts'
      - '.github/workflows/legacy-sales-quantity-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx tsx --test tests/legacy-sales-quantity.test.ts
