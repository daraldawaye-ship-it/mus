name: Wallet and rewards regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-rewards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Test exact multi-unit stock adjustment counting
        run: node --import tsx --test tests/stock-adjustment-count.test.ts
      - name: Test exact money display with thousands separators
        run: node --import tsx --test tests/format-money.test.ts
      - name: Check lookup option widths and purchase account defaults
        run: node --import tsx --test tests/lookup-option-label.test.ts tests/invoice-account-default.test.ts
      - name: Build web application
        run: npm run build
      - name: Test multi-unit physical counts and nearest expiry validation
        run: node --import tsx --test tests/stock-adjustment-count.test.ts
      - name: Test latest physical count including matching counts
        run: node --import tsx --test --test-name-pattern="item statistics track finalized stock" tests/api.test.ts
      - name: Test first-unit stock quantity display and rounding
        run: node --import tsx --test tests/sale-stock-quantity.test.ts
      - name: Test per-item daily sales and purchase activity
        run: node --import tsx --test --test-name-pattern="item statistics track finalized stock" tests/api.test.ts
      - name: Test adjustment counts and changed cutoff dates
        run: node --import tsx --test --test-name-pattern="item statistics track finalized stock" tests/api.test.ts
      - name: Test six-month purchase-price extremes across currencies and units
        run: node --import tsx --test --test-name-pattern="six month purchase extremes" tests/api.test.ts
      - name: Test default active item list and archived/all filters
        run: node --import tsx --test tests/item-active-filter.test.ts
      - name: Test account choice creation, editing and strict ordered labels
        run: node --import tsx --test --test-name-pattern="account card choice labels retain" tests/masters.test.ts
      - name: Test full-length account names and legacy identifiers
        run: node --import tsx --test --test-name-pattern="legacy account import permits" tests/masters.test.ts
      - name: Test multilingual catalog and invoice item search ranking
        run: node --import tsx --test --test-name-pattern="item lists search each name" tests/items.test.ts
      - name: Test item composition cards and company scoping
        run: node --import tsx --test --test-name-pattern="item compositions support" tests/items.test.ts
      - name: Test composition peer links and stock access
        run: node --import tsx --test --test-name-pattern="item compositions support" tests/items.test.ts
      - name: Test Arabic shelf cards, grouping and vitrine flags
        run: node --import tsx --test --test-name-pattern="Arabic shelf cards are seeded" tests/items.test.ts
      - name: Test relational shelf linkage in item cards
        run: node --import tsx --test --test-name-pattern="Item shelf cards are real company-scoped" tests/items.test.ts
      - name: Test safe composition bulk import and long names
        run: node --import tsx --test --test-name-pattern="composition bulk import" tests/items.test.ts
      - name: Test wallets, page visits and daily company entry
        run: node --import tsx --test tests/wallet.test.ts
      - name: Test wallet conversion policy and read-only preview
        run: node --import tsx --test tests/wallet-policy.test.ts
      - name: Test direct conversions and approval reservations
        run: node --import tsx --test tests/wallet-conversions.test.ts
      - name: Test supplier receipt references on purchases and payment vouchers
        run: node --import tsx --test --test-name-pattern="supplier receipt reference" tests/commerce.test.ts tests/finance.test.ts
      - name: Test doctor and institution cards, sales threshold and refund enforcement
        run: node --import tsx --test --test-name-pattern="doctor cards and positive" tests/commerce.test.ts
      - name: Test independent purchase supplier, cash and credit posting
        run: node --import tsx --test --test-name-pattern="purchase supplier is independent" tests/commerce.test.ts
      - name: Test automatic invoice and invoice-line rewards
        run: node --import tsx --test --test-name-pattern="invoice reward tasks are opt-in" tests/commerce.test.ts
      - name: Test Google and Apple OAuth authentication
        run: node --import tsx --test tests/social-auth.test.ts
      - name: Test phone-first identities and owner password reset
        run: node --import tsx --test tests/phone-identities.test.ts
      - name: Test automatic employee accounts and cashbox provisioning
        run: node --import tsx --test tests/employee-accounts.test.ts
      - name: Test dated item clearance commissions
        run: node --import tsx --test --test-name-pattern="dated item clearance commissions" tests/commerce.test.ts
      - name: Test employee clearance ledger and no-deduction return review
        run: node --import tsx --test --test-name-pattern="clearance earnings credit saver only" tests/commerce.test.ts
      - name: Test unified employee wallet foreign-currency commission conversion
        run: node --import tsx --test --test-name-pattern="foreign-currency clearance is posted" tests/commerce.test.ts
      - name: Test dynamic debit and credit account balances
        run: node --import tsx --test --test-name-pattern="dynamic account balances" tests/finance.test.ts
      - name: Test receipt and payment print rewards
        run: node --import tsx --test --test-name-pattern="posted receipt/payment print requests reward" tests/finance.test.ts
