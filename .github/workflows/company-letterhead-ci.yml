name: Company print letterhead checks
on:
  pull_request:
    paths:
      - 'apps/api/migrations/093_company_letterheads.sql'
      - 'apps/api/src/routes-media.ts'
      - 'apps/api/src/routes-companies.ts'
      - 'apps/web/src/CompanyPrintHeader.tsx'
      - 'apps/web/src/ImageUpload.tsx'
      - 'apps/web/src/pages/CompanyPages.tsx'
      - 'apps/web/src/pages/CommercePages.tsx'
      - 'apps/web/src/pages/FinancePages.tsx'
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/styles.css'
      - 'tests/api.test.ts'
      - '.github/workflows/company-letterhead-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-letterhead:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Owner-only letterhead persistence and company isolation
        run: node --import tsx --test --test-name-pattern="company print letterheads are durable" tests/api.test.ts
