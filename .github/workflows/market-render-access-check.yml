name: Market private service access probe
on:
  push:
    branches:
      - codex/market-render-access-check-2026-11-01
jobs:
  access-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether an existing Render automation secret can be used
        env:
          HAS_RENDER_API_KEY: ${{ secrets.RENDER_API_KEY != '' }}
          HAS_RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN != '' }}
        run: |
          echo "RENDER_API_KEY configured: $HAS_RENDER_API_KEY"
          echo "RENDER_API_TOKEN configured: $HAS_RENDER_API_TOKEN"
          echo "No secret values or API requests performed."
