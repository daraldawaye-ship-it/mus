name: Ledger single print header
on:
  pull_request:
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/reportPrintLayout.ts'
      - 'tests/ledger-print-layout.test.ts'
      - '.github/workflows/ledger-print-header-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-ledger-header:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Confirm one pledge statement print masthead
        run: node --import tsx --test tests/ledger-print-layout.test.ts
