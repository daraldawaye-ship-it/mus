name: Apply market sections once
on:
  push:
    branches: [preview/render-2026-10-23]
    paths: [.github/workflows/apply-market-sections-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preview/render-2026-10-23
      - name: Apply only the reviewed catalog changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('apps/web/src/pages/MedicineMarketPage.tsx')
          expected = '1c8eb91ed4876cc23ff76ec94e0d858d91042eb6'
          actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual != expected:
              raise SystemExit('Market page changed concurrently; refusing to overwrite it.')
          source = path.read_text()
          def replace(old, new):
              global source
              if source.count(old) != 1:
                  raise SystemExit('Expected unique integration anchor not found: ' + old[:100])
              source = source.replace(old, new, 1)
          replace(
              'import { MarketStagingProgress } from "./MarketStagingProgress";',
              'import { MarketStagingProgress } from "./MarketStagingProgress";\nimport { MarketCatalogSections, MarketCompactCard } from "./MarketCatalogSections";',
          )
          replace(
              '  const currentType = types.find((t) => t.key === kind);',
              '  const currentType = types.find((t) => t.key === kind);\n  const sectionedCatalog = tab === "catalog" && !selected && !kind && !q;',
          )
          replace(
              '    enabled: tab === "catalog",\n    refetchInterval: tab === "catalog" && !selected ? 20_000 : false,',
              '    enabled: tab === "catalog" && !sectionedCatalog,\n    refetchInterval: tab === "catalog" && !selected && !sectionedCatalog ? 20_000 : false,',
          )
          replace(
              '<div className="medicine-market" dir="rtl">',
              '<div className={`medicine-market${tab === "catalog" && !selected ? " medicine-market-directory" : ""}`} dir="rtl">',
          )
          replace(
              '          ) : (\n            <>\n              <div className="medicine-market-list-heading">',
              '''          ) : sectionedCatalog ? (
            <MarketCatalogSections types={visibleTypes} q={q} sort={sort} archived={archived}
              references={references} onOpen={openCard}
              onBrowse={nextKind => write({ kind: nextKind, page: null, card: null })} />
          ) : (
            <>
              <div className="medicine-market-list-heading">''',
          )
          start = '              <div className="medicine-market-grid">'
          end = '              {list.data && pagination(list.data.total, 18)}'
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('The existing card list no longer matches the reviewed layout.')
          a, b = source.index(start), source.index(end)
          if b <= a:
              raise SystemExit('Invalid card-list boundaries.')
          source = source[:a] + '''              <div className="market-compact-list">
                {list.data?.items.map(item => <MarketCompactCard key={item.id} item={item}
                  type={types.find(type => type.key === item.kind)} references={references}
                  onOpen={openCard} />)}
              </div>
          '''.rstrip() + '\n' + source[b:]
          replace('<option value="">جميع الكروت</option>', '<option value="">أقسام السوق</option>')
          replace('{ key: "", label: "الكل" }', '{ key: "", label: "أقسام السوق" }')
          replace(
              '<section className="medicine-market-admin-references" aria-label="البيانات المرجعية الثابتة">\n          <h2>البيانات المرجعية للإدارة</h2>',
              '<details className="medicine-market-admin-references">\n          <summary>إدارة بيانات السوق والبيانات المرجعية</summary>',
          )
          replace(
              '{user?.owner && <MarketStagingProgress />}\n        </section>',
              '{user?.owner && <MarketStagingProgress />}\n        </details>',
          )
          path.write_text(source)
          print('Integrated section previews and compact rows; record/detail/moderation logic preserved.')
          PY
          git diff --check
          git rm -- .github/workflows/apply-market-sections-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/src/pages/MedicineMarketPage.tsx
          git commit -m 'feat(market): separate home sections and use compact two-line catalog rows'
          git push origin HEAD:preview/render-2026-10-23
