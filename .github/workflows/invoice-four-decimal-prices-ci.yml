name: Invoice four decimal prices
on:
  pull_request:
    paths:
      - 'packages/contracts/src/commerce.ts'
      - 'apps/api/src/services/commerce.ts'
      - 'apps/api/migrations/20261104_invoice_price_four_decimals.sql'
      - 'tests/invoice-four-decimal-prices.test.ts'
      - 'tests/commerce.test.ts'
      - '.github/workflows/invoice-four-decimal-prices-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/invoice-four-decimal-prices.test.ts tests/commerce.test.ts
