name: Verify live two-image market policy
on:
  push:
    branches: [preview/render-2026-10-23]
    paths: [.github/workflows/verify-market-two-images-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preview/render-2026-10-23
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - name: Read-only HTTP verification of published images
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import sharp from 'sharp';
          const base='https://alraesy-private-preview.onrender.com';
          const get=path=>fetch(base+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
          assert.equal((await get('/api/health')).status,200);
          const cards=await get('/api/medicine-market/cards?kind=prescription&pageSize=1');
          assert.equal(cards.status,200);
          const card=(await cards.json()).items[0]; assert.ok(card?.data.image);
          let main;
          for(let attempt=0;attempt<12;attempt++){
            const response=await get(`/api/medicine-market/cards/${card.id}/image-variants/main?v=${card.revision}`);
            if(response.status===200&&response.headers.get('content-type')?.startsWith('image/webp')){
              main=Buffer.from(await response.arrayBuffer());break;
            }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          assert.ok(main,'new main-image route is live');
          const info=await sharp(main).metadata();
          assert.ok(info.width<=1200&&info.height<=1200&&main.length<=204800);
          assert.equal(info.pages??1,1);
          for(const suffix of ['', '?variant=main','?variant=preview','?variant=original']){
            const response=await get(card.data.image+suffix);
            assert.equal(response.status,200);assert.match(response.headers.get('content-type')??'',/^image\/webp/);
            assert.deepEqual(Buffer.from(await response.arrayBuffer()),main,'legacy URL must use the same main WebP');
          }
          const response=await get(`/api/medicine-market/cards/${card.id}/image-variants/icon?v=${card.revision}`);
          assert.equal(response.status,200);const icon=Buffer.from(await response.arrayBuffer());
          const iconInfo=await sharp(icon).metadata();
          assert.ok(icon.length<=16384&&iconInfo.width<=64&&iconInfo.height<=64);
          assert.equal((await get('/api/medicine-market/image-variants/status')).status,403);
          console.log('LIVE_TWO_IMAGES_OK',JSON.stringify({mainBytes:main.length,mainWidth:info.width,mainHeight:info.height,iconBytes:icon.length,iconWidth:iconInfo.width,iconHeight:iconInfo.height,legacyAliasesIdentical:true}));
          JS
      - name: Remove completed one-time verification
        run: |
          git pull --ff-only origin preview/render-2026-10-23
          git rm -- .github/workflows/verify-market-two-images-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove completed two-image HTTP verification workflow'
          git push origin HEAD:preview/render-2026-10-23
