name: Presence and attendance reports
on:
  push:
    branches: ['preview/render-2026-10-23']
    paths: ['apps/api/src/routes-public.ts', 'apps/api/src/routes-attendance.ts', 'apps/web/src/**', 'tests/last-present-attendance.test.ts']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/last-present-attendance.test.ts
