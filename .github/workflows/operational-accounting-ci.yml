name: Default payroll and reward accounting

on:
  pull_request:
    paths:
      - 'apps/api/migrations/060_default_employee_accounting.sql'
      - 'apps/api/src/routes-accounts.ts'
      - 'apps/api/src/routes-companies.ts'
      - 'packages/contracts/src/masters.ts'
      - 'tests/operational-account-defaults.test.ts'
      - 'tests/wallet-policy.test.ts'
      - 'tests/wallet-conversions.test.ts'
      - '.github/workflows/operational-accounting-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Test new company financial account defaults
        run: node --import tsx --test tests/operational-account-defaults.test.ts
      - name: Test wallet policy and conversion compatibility
        run: node --import tsx --test tests/wallet-policy.test.ts tests/wallet-conversions.test.ts
      - run: npm run build
