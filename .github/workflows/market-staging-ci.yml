name: Market staging CI
on:
  push:
    branches: [preview/render-2026-10-23]
    paths: ['apps/api/src/routes-market-staging.ts', 'apps/api/market-migrations/005_staging_import.sql', 'tests/market-staging.test.ts', '.github/workflows/market-staging-ci.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARKET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/market_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/market-staging.test.ts tests/medicine-market-native.test.ts
