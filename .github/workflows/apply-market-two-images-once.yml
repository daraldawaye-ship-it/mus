name: Apply market two-image policy once
on:
  push:
    branches: [preview/render-2026-10-23]
    paths: [.github/workflows/apply-market-two-images-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: image_tests
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preview/render-2026-10-23
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Integrate bounded two-copy storage without overwriting concurrent changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
            'apps/api/src/market/image-variants.ts': 'ae73ec5fc47083c37ac5ab9480c0885d29615aa5',
            'apps/api/src/routes-medicine-market.ts': 'ada91c38769d8f35bd0ff6352ef9b0a1a1dd9747',
            'apps/web/src/MarketImageUpload.tsx': 'ae3c6beb36b8f48274a14a3157cbe875c2534e7e',
            'tests/market-image-variants.test.ts': 'c2cdcced114e40ca97d845a57bb5e9d4fe367667',
          }
          for path, sha in expected.items():
            if subprocess.check_output(['git','hash-object',path],text=True).strip()!=sha:
              raise SystemExit('Concurrent source edit: '+path)
          def change(path, old, new, count=1):
            p=Path(path); source=p.read_text()
            if source.count(old)!=count:
              raise SystemExit('Unexpected anchor: '+path+' '+repr(old[:100]))
            p.write_text(source.replace(old,new))
          module='apps/api/src/market/image-variants.ts'
          p=Path(module); s=p.read_text()
          a=s.index('export type ImageVariant ='); b=s.index('/** IPv4-only pinned DNS:')
          s=s[:a]+'''// Only two persistent files: bounded main WebP and icon. The preview name
          // remains an HTTP/schema compatibility alias, never a third local file.
          export type ImageVariant = "icon" | "preview" | "main";
          export type ImageVariants = {
            icon: Buffer; preview: Buffer;
            iconWidth: number; iconHeight: number;
            previewWidth: number; previewHeight: number; sourceBytes: number;
          };
          export const imageSourceKey = (source: string) => createHash("sha256").update(source).digest("hex");
          let transformations = 0;

          /** GIF is decoded as one still frame; metadata and the raw input are not stored. */
          export async function buildMarketImageVariants(bytes: Buffer): Promise<ImageVariants> {
            if (!bytes.length || bytes.length > MAX_SOURCE)
              throw new HttpError(400, "image_size", "حجم الصورة غير مدعوم");
            if (transformations >= 2)
              throw new HttpError(429, "image_busy", "تجهيز الصور مشغول؛ أعد المحاولة");
            transformations++;
            try {
              const options = { limitInputPixels: 30_000_000, animated: false, pages: 1 };
              const meta = await sharp(bytes, options).metadata();
              if (!["jpeg", "png", "webp", "gif", "avif", "heif"].includes(meta.format ?? ""))
                throw new HttpError(400, "image_format", "صيغة الصورة غير مدعومة");
              const resize = async (size: number, maximum: number) => {
                for (const scale of [1, 0.8, 0.6]) {
                  for (const quality of [82, 70, 56, 42, 28]) {
                    const side = Math.max(1, Math.floor(size * scale));
                    const output = await sharp(bytes, options).rotate()
                      .resize(side, side, { fit: "inside", withoutEnlargement: true })
                      .webp({ quality, effort: 3 }).timeout({ seconds: 2 })
                      .toBuffer({ resolveWithObject: true });
                    if (output.data.length <= maximum) return output;
                  }
                }
                throw new HttpError(400, "image_size", "تعذر تجهيز نسخة خفيفة للصورة");
              };
              // Do not recompress or enlarge old images that already meet the policy.
              const reusable = meta.format === "webp" && (meta.pages ?? 1) === 1 &&
                !!meta.width && !!meta.height && meta.width <= 1200 && meta.height <= 1200 &&
                bytes.length <= 200 * 1024 && !meta.exif && !meta.xmp && !meta.icc && !meta.orientation;
              const main = reusable ? { data: bytes, info: { width: meta.width!, height: meta.height! } }
                : await resize(1200, 200 * 1024);
              const icon = await resize(64, 16 * 1024);
              return { icon: icon.data, preview: main.data,
                iconWidth: icon.info.width, iconHeight: icon.info.height,
                previewWidth: main.info.width, previewHeight: main.info.height,
                sourceBytes: main.data.length };
            } catch (error) {
              if (error instanceof HttpError) throw error;
              throw new HttpError(400, "image_decode", "تعذر قراءة الصورة أو أبعادها كبيرة جدًا");
            } finally { transformations--; }
          }

          /** Local main bytes live once in uploads; external cached main bytes live once here. */
          export async function storeMarketImageVariants(db: Database, source: string, value: ImageVariants) {
            const localId = LOCAL_IMAGE.exec(source)?.[1] ?? null;
            if (localId) {
              // Preserve identity, moderation, card revision and ordering. Replace oversized
              // historical bytes only after a valid, bounded WebP has been generated.
              await db.query(`UPDATE market_image_uploads SET image_bytes=$2,byte_size=$3,width=$4,height=$5
                WHERE id=$1 AND (image_bytes IS DISTINCT FROM $2 OR byte_size IS DISTINCT FROM $3
                  OR width IS DISTINCT FROM $4 OR height IS DISTINCT FROM $5)`,
                [localId,value.preview,value.preview.length,value.previewWidth,value.previewHeight]);
            }
            await db.query(`INSERT INTO market_image_variants
              (source_key,source_url,image_id,status,icon_bytes,preview_bytes,icon_width,icon_height,
               preview_width,preview_height,source_bytes,error_code,storage_version)
              VALUES($1,$2,$3,'ready',$4,$5,$6,$7,$8,$9,$10,'',2)
              ON CONFLICT(source_key) DO UPDATE SET status='ready',image_id=EXCLUDED.image_id,
                icon_bytes=EXCLUDED.icon_bytes,preview_bytes=EXCLUDED.preview_bytes,
                icon_width=EXCLUDED.icon_width,icon_height=EXCLUDED.icon_height,
                preview_width=EXCLUDED.preview_width,preview_height=EXCLUDED.preview_height,
                source_bytes=EXCLUDED.source_bytes,error_code='',storage_version=2,updated_at=now()`,
              [imageSourceKey(source), source, localId, value.icon, localId ? null : value.preview,
                value.iconWidth, value.iconHeight, localId ? null : value.previewWidth,
                localId ? null : value.previewHeight, value.sourceBytes]);
          }

          export async function readMarketImageVariant(db: Database, source: string, variant: ImageVariant): Promise<Buffer | null> {
            // The caller checks card/image visibility and source-card binding first.
            const column = variant === "icon" ? "v.icon_bytes"
              : "CASE WHEN v.image_id IS NOT NULL THEN i.image_bytes ELSE v.preview_bytes END";
            const result = await db.query(`SELECT ${column} AS bytes FROM market_image_variants v
              LEFT JOIN market_image_uploads i ON i.id=v.image_id
              WHERE v.source_key=$1 AND v.status='ready'`, [imageSourceKey(source)]);
            return result.rows[0]?.bytes ?? null;
          }

          '''+s[b:]
          p.write_text(s)
          a=s.index('const sourcesSql ='); b=s.index('type BackfillState =')
          s=s[:a]+'''// Include historical and pending local uploads too, not only current card photos.
          const sourcesSql = `SELECT min(card_id)::integer AS card_id,source_url FROM (
            SELECT c.id AS card_id,
              COALESCE(NULLIF(c.data->>'image',''),NULLIF(c.data->>'imageUrl','')) AS source_url
              FROM medicine_market_cards c WHERE c.kind<>'composition'
            UNION ALL
            SELECT i.card_id,'/api/medicine-market/images/'||i.id::text
              FROM market_image_uploads i JOIN medicine_market_cards c ON c.id=i.card_id
              WHERE c.kind<>'composition'
          ) all_sources WHERE source_url IS NOT NULL GROUP BY source_url`;
          '''+s[b:]
          p.write_text(s)
          change(module,"count(*) FILTER(WHERE v.status='ready')::integer AS ready,","count(*) FILTER(WHERE v.status='ready' AND v.storage_version=2)::integer AS ready,")
          change(module,"count(*) FILTER(WHERE v.source_key IS NULL)::integer AS pending,","count(*) FILTER(WHERE v.source_key IS NULL OR (v.status='ready' AND v.storage_version<2))::integer AS pending,")
          change(module,'COALESCE(sum(octet_length(v.preview_bytes)),0)::text AS "previewBytes",','COALESCE(sum(octet_length(v.preview_bytes)) FILTER(WHERE v.image_id IS NOT NULL),0)::text AS "previewBytes",\n      COALESCE(sum(CASE WHEN v.image_id IS NOT NULL THEN octet_length(i.image_bytes) ELSE octet_length(v.preview_bytes) END),0)::text AS "mainBytes",')
          change(module,'FROM sources s LEFT JOIN market_image_variants v ON v.source_url=s.source_url`)).rows[0];','FROM sources s LEFT JOIN market_image_variants v ON v.source_url=s.source_url\n      LEFT JOIN market_image_uploads i ON i.id=v.image_id`)).rows[0];')
          change(module,'run: jobs.get(pool) ?? null, failures, iconMaxSide: 64, previewMaxSide: 240','run: jobs.get(pool) ?? null, failures, iconMaxSide: 64, iconMaxBytes: 16384,\n    mainMaxSide: 1200, mainMaxBytes: 204800, storedCopies: 2, policyVersion: 2')
          change(module,'let after = 0;', 'let after = "";')
          change(module,"WHERE s.card_id>$1 AND (v.source_key IS NULL OR ($2 AND v.status='error'))\n          ORDER BY s.card_id LIMIT 20", "WHERE s.source_url>$1 AND (v.source_key IS NULL OR (v.status='ready' AND v.storage_version<2) OR ($2 AND v.status='error'))\n          ORDER BY s.source_url LIMIT 20")
          change(module,'after = Number(entry.card_id); const source = String(entry.source_url);','after = String(entry.source_url); const source = after;')
          migration='apps/api/market-migrations/20261112_market_images_two_copies.sql'
          if Path(migration).exists(): raise SystemExit('Migration already exists')
          Path(migration).write_text('''-- Main WebP + icon only. Byte compaction is an explicit owner-triggered pass,
          -- not a destructive migration during startup or an update to card contents.
          ALTER TABLE market_image_variants ADD COLUMN storage_version integer NOT NULL DEFAULT 1;
          ALTER TABLE market_image_variants DROP CONSTRAINT market_image_variants_check;
          ALTER TABLE market_image_variants DROP CONSTRAINT market_image_variants_preview_bytes_check;
          ALTER TABLE market_image_variants DROP CONSTRAINT market_image_variants_preview_width_check;
          ALTER TABLE market_image_variants DROP CONSTRAINT market_image_variants_preview_height_check;
          ALTER TABLE market_image_variants ADD CONSTRAINT market_image_variants_preview_bytes_check
            CHECK(octet_length(preview_bytes)<=204800);
          ALTER TABLE market_image_variants ADD CONSTRAINT market_image_variants_preview_width_check
            CHECK(preview_width BETWEEN 1 AND 1200);
          ALTER TABLE market_image_variants ADD CONSTRAINT market_image_variants_preview_height_check
            CHECK(preview_height BETWEEN 1 AND 1200);
          ALTER TABLE market_image_variants ADD CONSTRAINT market_image_variants_ready_check
            CHECK(status<>'ready' OR (icon_bytes IS NOT NULL AND icon_width IS NOT NULL AND icon_height IS NOT NULL
              AND (image_id IS NOT NULL OR (preview_bytes IS NOT NULL AND preview_width IS NOT NULL AND preview_height IS NOT NULL))));
          -- Retain existing legacy limits until the owner pass has safely compacted old files.
          ALTER TABLE market_image_uploads DROP CONSTRAINT IF EXISTS market_image_uploads_width_check;
          ALTER TABLE market_image_uploads DROP CONSTRAINT IF EXISTS market_image_uploads_height_check;
          ALTER TABLE market_image_uploads DROP CONSTRAINT IF EXISTS market_image_uploads_byte_size_check;
          ALTER TABLE market_image_uploads ADD CONSTRAINT market_image_uploads_width_check CHECK(width BETWEEN 1 AND 1600);
          ALTER TABLE market_image_uploads ADD CONSTRAINT market_image_uploads_height_check CHECK(height BETWEEN 1 AND 1600);
          ALTER TABLE market_image_uploads ADD CONSTRAINT market_image_uploads_byte_size_check CHECK(byte_size BETWEEN 1 AND 512000);
          ''')
          route='apps/api/src/routes-medicine-market.ts'
          change(route,"profile:'medicine'|'prescription'='medicine'", "_profile:'medicine'|'prescription'='medicine'")
          change(route,"bytes.length>(profile==='prescription'?512000:102400)", 'bytes.length>204800')
          change(route,'الصورة غير صالحة أو تتجاوز 100 كيلوبايت','الصورة غير صالحة أو تتجاوز 200 كيلوبايت')
          a=Path(route).read_text(); start=a.index("  if(profile==='medicine' &&"); end=a.index('  return {bytes,width,height};',start)
          a=a[:start]+'''  if(width<1||height<1||width>1200||height>1200)
              throw new HttpError(400,"image_dimensions","الضلع الأكبر للصورة لا يتجاوز 1200 بكسل");
            if(codec==="VP8X" && (bytes[20]&2)!==0)
              throw new HttpError(400,"image_animation","حوّل GIF إلى صورة WebP ثابتة قبل الرفع");
          '''+a[end:]; Path(route).write_text(a)
          change(route,'z.enum(["icon","preview"])','z.enum(["icon","preview","main"])')
          change(route,'bytes=versions[variant];','bytes=versions[variant==="icon"?"icon":"preview"];',2)
          change(route,'z.enum(["original","icon","preview"]),req.query.variant??"original"','z.enum(["main","original","icon","preview"]),req.query.variant??"main"')
          change(route,'if(variant!=="original"){','if(variant==="icon"){')
          change(route,'previewUrl:marketImagePath(assetId)+"?variant=preview",iconBytes:variants.icon.length,previewBytes:variants.preview.length','mainUrl:marketImagePath(assetId),iconBytes:variants.icon.length,mainBytes:variants.preview.length')
          gateway='apps/api/src/market/gateway.ts'
          change(gateway,'(?:icon|preview)', '(?:icon|preview|main)')
          upload='apps/web/src/MarketImageUpload.tsx'
          a=Path(upload).read_text(); start=a.index('/** Complete image,'); end=a.index('\nexport function MarketImageUpload',start)
          a=a[:start]+'''/** GIF (including .gif files without a MIME label) becomes one still WebP.
           * createImageBitmap reads the default/first animation frame; canvas strips metadata.
           * Only the encoded result is uploaded. The source file never enters storage.
           */
          export async function prepareMarketImage(file:File,_profile:PictureProfile="medicine"){
            const gif=file.type.toLowerCase()==="image/gif" || /\\.gif$/i.test(file.name);
            if((!file.type.startsWith("image/")&&!gif)||file.size>MAX_INPUT_BYTES||file.size===0)
              throw Error("اختر صورة أو GIF لا يزيد حجم ملفها قبل الضغط عن 12 ميجابايت");
            const image=await createImageBitmap(file);
            try{
              if(image.width<1||image.height<1||image.width*image.height>30_000_000)
                throw Error("أبعاد الصورة غير مدعومة");
              const canvas=document.createElement("canvas");
              const ctx=canvas.getContext("2d");
              if(!ctx)throw Error("المتصفح لا يدعم تجهيز الصور");
              for(const ratio of [1,0.85,0.7,0.5]){
                const scale=Math.min(1,1200*ratio/Math.max(image.width,image.height));
                canvas.width=Math.max(1,Math.round(image.width*scale));
                canvas.height=Math.max(1,Math.round(image.height*scale));
                ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
                ctx.drawImage(image,0,0,canvas.width,canvas.height);
                let fallback:{dataUrl:string;bytes:number}|null=null;
                for(const quality of [0.85,0.8,0.72,0.62,0.5,0.38,0.28]){
                  const dataUrl=canvas.toDataURL("image/webp",quality);
                  if(!dataUrl.startsWith(DATA_PREFIX))throw Error("هذا المتصفح لا يدعم حفظ صور WebP");
                  const encoded=dataUrl.slice(DATA_PREFIX.length);
                  const bytes=encoded.length*3/4-(encoded.endsWith("==")?2:encoded.endsWith("=")?1:0);
                  if(bytes<=150*1024)return {dataUrl,bytes,width:canvas.width,height:canvas.height};
                  if(bytes<=200*1024&&!fallback)fallback={dataUrl,bytes};
                }
                if(fallback)return {...fallback,width:canvas.width,height:canvas.height};
              }
              throw Error("تعذر ضغط الصورة إلى 200 كيلوبايت؛ اختر صورة بخلفية أبسط");
            } finally {image.close();}
          }
          '''+a[end:]; Path(upload).write_text(a)
          change(upload,'accept="image/*"','accept="image/*,.gif"')
          old='''      {prescription
                 ?"يُحفظ كامل نص الوصفة بقدر الإمكان، دون قص، بصيغة WebP؛ حتى 1600 بكسل و500 كيلوبايت."
                 :"الصورة كاملة ومضغوطة؛ تُجهز تلقائيًا معاينة 240 بكسل وأيقونة 64 بكسل للبحث والقوائم."}'''
          # Locate the existing help text by unique literal boundaries, independent of indentation.
          p=Path(upload); s=p.read_text(); start=s.index('      {prescription\n       ?"يُحفظ كامل'); end=s.index('\n    </small>',start)
          s=s[:start]+'''      WebP حتى 200 كيلوبايت و1200 بكسل + أيقونة حتى 16 كيلوبايت و64 بكسل فقط.
                GIF مسموحة وتُحفظ صورة ثابتة؛ لا يُحفظ الملف الأصلي أو نسخة معاينة ثالثة.'''+s[end:];p.write_text(s)
          product='apps/web/src/MarketProductImage.tsx'
          change(product,'?src+"?variant=preview":src;', '?src+"?variant=main":src;')
          test='tests/market-image-variants.test.ts'
          change(test,'assert.equal(variants.previewWidth, 240); assert.equal(variants.previewHeight, 120);','assert.equal(variants.previewWidth, 512); assert.equal(variants.previewHeight, 256);\n  assert.deepEqual(variants.preview, original, "do not recompress a compliant main WebP");')
          change(test,'variants.preview.length <= 64 * 1024','variants.preview.length <= 200 * 1024')
          change(test,'assert.equal((await sharp(Buffer.from(await preview.arrayBuffer())).metadata()).width, 240);','assert.equal((await sharp(Buffer.from(await preview.arrayBuffer())).metadata()).width, 512);\n    const saved=(await pool.query("SELECT preview_bytes,storage_version FROM market_image_variants WHERE image_id=$1",[result.url.split("/").at(-1)])).rows[0];\n    assert.equal(saved.preview_bytes,null,"no third persisted copy");\n    assert.equal(saved.storage_version,2);')
          anchor='    await pool.query(await readFile(new URL("../apps/api/market-migrations/20261112_market_image_variants.sql", import.meta.url), "utf8"));'
          change(test,anchor,anchor+'\n    await pool.query(await readFile(new URL("../apps/api/market-migrations/20261112_market_images_two_copies.sql", import.meta.url), "utf8"));')
          p=Path(test);p.write_text(p.read_text()+'''
          test("static GIF is converted to bounded main WebP and icon without retaining GIF", async () => {
            const gif=await sharp({create:{width:1600,height:800,channels:3,background:"#409080"}}).gif().toBuffer();
            const out=await buildMarketImageVariants(gif);
            const main=await sharp(out.preview).metadata(), icon=await sharp(out.icon).metadata();
            assert.equal(main.format,"webp");assert.equal(main.pages??1,1);
            assert.equal(main.width,1200);assert.equal(main.height,600);
            assert.ok(out.preview.length<=204800);assert.ok(out.icon.length<=16384);
            assert.equal(icon.width,64);assert.equal(icon.height,32);
          });
          ''')
          Path('docs/MARKET_IMAGE_STORAGE_POLICY.md').write_text('''# Market card images: two-copy policy

          Owner decision, 12 November 2026: retain only one main static WebP (maximum
          1200px on either side and 204800 bytes) and one WebP icon (maximum 64px and
          16384 bytes). Preserve aspect ratio, never crop or upscale small images.
          GIF input is explicitly permitted; createImageBitmap selects its default/first
          frame and canvas encodes a still WebP before uploading. Raw uploads are never
          persisted. This applies to market photos, not company/document attachments.

          Local main WebP bytes live in market_image_uploads. Its variant row retains
          only the icon; preview_bytes/width/height are NULL. For legacy external URLs,
          preview_bytes is a compatibility column containing the single bounded main
          WebP. There is no third copy. The original and preview HTTP variant names
          remain compatibility aliases for main, not independent stored files.

          The owner backfill processes all local assets (including pending/history) and
          referenced external URLs. It preserves compliant existing WebP bytes, compacts
          oversized files, removes redundant local previews after the main is safely
          available, and marks storage_version=2. It does not change card IDs, revisions,
          moderation or ordering. Use image-variants/status to verify policyVersion=2,
          pending=0 and previewBytes=0 for local assets; failed sources require review.

          All existing visibility checks, private-prescription moderation, source-card
          binding, deletion cascade and external-source SSRF restrictions remain.
          ''')
          print('Applied GIF-to-still input, strict size bounds, compatible main aliases and two-file storage.')
          PY
