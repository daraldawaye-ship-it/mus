name: Sales Print Compact CI
on:
  pull_request:
    paths:
      - "apps/web/src/InvoicePrintSheet.tsx"
      - "apps/web/src/styles.css"
      - "tests/sales-print-compact.test.ts"
      - ".github/workflows/sales-print-compact-ci.yml"
  push:
    branches:
      - preview/render-2026-10-23
    paths:
      - "apps/web/src/InvoicePrintSheet.tsx"
      - "apps/web/src/styles.css"
      - "tests/sales-print-compact.test.ts"
      - ".github/workflows/sales-print-compact-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-print:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/sales-print-compact.test.ts
