name: Public user password reset
on:
  pull_request:
    paths:
      - 'apps/web/src/pages/PublicPages.tsx'
      - 'apps/api/src/routes-public.ts'
      - 'tests/api.test.ts'
      - '.github/workflows/public-password-reset-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-password-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Reset passwords of users without employee membership
        run: node --import tsx --test --test-name-pattern="owner password reset applies to public users" tests/api.test.ts
