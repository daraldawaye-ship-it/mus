name: Legal Document Review
on:
  push:
    branches: [work/legal-document-review, preview/render-2026-10-23]
    paths:
      - "apps/api/src/routes-legal-cases.ts"
      - "apps/api/migrations/*legal_document_review.sql"
      - "apps/web/src/pages/Legal*"
      - "packages/contracts/src/legal-document-review.ts"
      - "tests/legal-document-review.test.ts"
      - ".github/workflows/legal-document-review-ci.yml"
  pull_request:
    paths:
      - "apps/api/src/routes-legal-cases.ts"
      - "apps/api/migrations/*legal_document_review.sql"
      - "apps/web/src/pages/Legal*"
      - "packages/contracts/src/legal-document-review.ts"
      - "tests/legal-document-review.test.ts"
      - ".github/workflows/legal-document-review-ci.yml"
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/legal-document-review.test.ts
      - run: npm run build
