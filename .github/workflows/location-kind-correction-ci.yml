name: Location type correction

on:
  push:
    branches:
      - preview/render-2026-10-23
    paths:
      - 'packages/contracts/src/masters.ts'
      - 'apps/api/src/routes-locations.ts'
      - 'apps/web/src/pages/LocationPages.tsx'
      - 'tests/masters.test.ts'
      - '.github/workflows/location-kind-correction-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate warehouse/returns correction and showroom protections
        run: node --import tsx --test --test-name-pattern="branch creation|returns location|location kinds can|branch and location codes" tests/masters.test.ts
