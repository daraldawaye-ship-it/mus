name: Positive item order quantities
on:
  pull_request:
    paths:
      - 'apps/api/migrations/20261103_min_one_item_order_quantity.sql'
      - 'apps/web/src/pages/ItemsPages.tsx'
      - 'apps/web/src/positive-integer-input.ts'
      - 'packages/contracts/src/items.ts'
      - 'tests/items.test.ts'
      - 'tests/item-positive-order-quantity.test.ts'
      - '.github/workflows/item-positive-order-quantity-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  item-order-quantity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/item-positive-order-quantity.test.ts tests/items.test.ts
