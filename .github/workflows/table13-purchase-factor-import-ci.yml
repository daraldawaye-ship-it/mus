name: Table13 purchase factor batch import
on:
  pull_request:
    paths:
      - 'apps/api/src/routes-item-import.ts'
      - 'apps/api/src/mcp-contracts.json'
      - 'tests/item-purchase-factor-table13-import.test.ts'
      - '.github/workflows/table13-purchase-factor-import-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  table13-factor-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/item-purchase-factor-table13-import.test.ts
