name: Questions feature checks
on:
  push:
    branches:
      - feat/questions-render-2026-10-28
  pull_request:
    paths:
      - 'apps/api/src/routes-questions.ts'
      - 'apps/api/migrations/147_questions_answers.sql'
      - 'apps/web/src/pages/QuestionsPage.tsx'
      - 'apps/web/src/question-result.ts'
      - 'apps/web/src/styles.css'
      - 'apps/web/src/pages/CommercePages.tsx'
      - 'apps/web/src/invoice-account-default.ts'
      - 'tests/question-verdict.test.ts'
      - 'tests/questions.test.ts'
      - 'packages/contracts/src/pages.ts'
      - 'apps/web/src/App.tsx'
      - '.github/workflows/questions-ci.yml'
jobs:
  questions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tijara
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tijara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tijara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/question-verdict.test.ts
      - run: npx tsx --test tests/questions.test.ts
