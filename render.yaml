# Owner approved additional market-isolation costs on 2026-11-01.
# Render production after the completed cutover; resource names are historical.
previews:
  generation: "off"

services:
  - type: web
    name: alraesy-private-preview
    runtime: docker
    repo: https://github.com/daraldawaye-ship-it/mus
    branch: preview/render-2026-10-23
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: PREVIEW_ACCESS_MODE
        value: public
      - key: APP_ORIGIN
        value: https://alraesy-private-preview.onrender.com
      - key: STARTUP_SELF_CHECK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: alraesy-preview-db
          property: connectionString
      # Host and secret are prepared while the app continues using the original market DB.
      # Activate only after freezing market traffic and verifying the transfer.
      - key: MARKET_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: alraesy-medicine-market-api
          property: hostport
      - fromGroup: alraesy-medicine-market-auth
    # Update APP_ORIGIN if a custom HTTPS domain is adopted.

  - type: pserv
    name: alraesy-medicine-market-api
    runtime: docker
    repo: https://github.com/daraldawaye-ship-it/mus
    branch: preview/render-2026-10-23
    region: frankfurt
    plan: 1c-2g
    dockerfilePath: ./Dockerfile.market
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: MARKET_DATABASE_SCHEMA
        value: market
      - key: MARKET_DATABASE_URL
        fromDatabase:
          name: alraesy-medicine-market-db
          property: connectionString
      - fromGroup: alraesy-medicine-market-auth

databases:
  # Owner-approved scale-up 2026-11-01: cashier database pressure was near
  # its CPU ceiling on 0.1c-256mb. Target 5x CPU / 4x RAM without migrating data.
  # Applied to the live database only after a Render Blueprint sync / plan edit.
  - name: alraesy-preview-db
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: tijara_preview
    user: tijara_preview
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []

  # Created separately on 2026-11-01. Reference the existing dedicated database;
  # do not replace or reset company database.
  - name: alraesy-medicine-market-db
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: alraesy_medicine_market_db
    user: alraesy_medicine_market_db_user
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []

envVarGroups:
  - name: alraesy-medicine-market-auth
    envVars:
      - key: MARKET_SERVICE_SECRET
        generateValue: true
