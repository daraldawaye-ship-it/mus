name: Pharmacy questions import checks
on:
  push:
    branches:
      - feat/import-228-pharmacy-main-2026-10-28
  pull_request:
    paths:
      - 'apps/api/migrations/059_import_pharmacy_questions.sql'
      - 'tests/pharmacy-questions-import.test.ts'
      - '.github/workflows/pharmacy-questions-ci.yml'
jobs:
  pharmacy-questions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tijara
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tijara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tijara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test tests/pharmacy-questions-import.test.ts
