name: Whole Stock Secondary Unit Edits CI
on:
  pull_request:
    paths:
      - 'apps/api/src/services/item-unit-history.ts'
      - 'apps/api/src/routes-items.ts'
      - 'apps/api/migrations/20261104_whole_stock_secondary_unit_edits.sql'
      - 'apps/web/src/pages/ItemsPages.tsx'
      - 'tests/items.test.ts'
      - 'tests/item-unit-history-and-invoice-side.test.ts'
      - 'tests/item-new-unit-atomic.test.ts'
      - '.github/workflows/whole-stock-unit-edits-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/item-unit-history-and-invoice-side.test.ts tests/item-new-unit-atomic.test.ts
      - run: node --import tsx --test --test-name-pattern='whole first-unit stock permits|atomic new unit activation' tests/items.test.ts
