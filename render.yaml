# Review the paid web and database plans in Render before applying this Blueprint.
services:
  - type: web
    name: tijara
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: tijara-db
          property: connectionString

databases:
  - name: tijara-db
    plan: basic-256mb
    region: frankfurt
    databaseName: tijara
    user: tijara
    ipAllowList: []
