name: Cashier transfer alerts
on:
  pull_request:
    paths:
      - "apps/api/**"
      - "tests/finance.test.ts"
      - ".github/workflows/cashier-alert-ci.yml"
  push:
    branches:
      - codex/deploy-phase2
jobs:
  cashier-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tijara_cashier_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tijara_cashier_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tijara_cashier_ci
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Check cashier-only notifications and permission revocation
        run: npx tsx --test --test-name-pattern="cashbox transfers and closure notify" tests/finance.test.ts
