name: Avatar menu positioning regression
on:
  pull_request:
    paths:
      - 'apps/web/src/styles.css'
      - 'apps/web/src/user-menu-tabs.css'
      - 'apps/web/src/UserMenu.tsx'
      - 'tests/avatar-menu-position-regression.test.ts'
      - '.github/workflows/avatar-menu-position-regression.yml'
jobs:
  popup-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/avatar-menu-position-regression.test.ts
