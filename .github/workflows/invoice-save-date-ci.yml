name: Invoice Save Date CI
on:
  push:
    branches:
      - preview/render-2026-10-23
    paths:
      - "apps/web/src/pages/CommercePages.tsx"
      - "apps/web/src/invoice-save-date.ts"
      - "apps/api/src/routes-commerce.ts"
      - "apps/api/src/services/invoice-posting-date.ts"
      - "tests/invoice-save-date.test.ts"
      - ".github/workflows/invoice-save-date-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invoice-date:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/invoice-save-date.test.ts
