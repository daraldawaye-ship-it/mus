# Additional paid resources: review pricing and obtain cost approval before applying.
# Render production after the completed cutover; resource names are historical.
previews:
  generation: "off"

services:
  - type: web
    name: alraesy-private-preview
    runtime: docker
    repo: https://github.com/daraldawaye-ship-it/mus
    branch: preview/render-2026-10-23
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: PREVIEW_ACCESS_MODE
        value: public
      - key: APP_ORIGIN
        value: https://alraesy-private-preview.onrender.com
      - key: STARTUP_SELF_CHECK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: alraesy-preview-db
          property: connectionString
    # Update APP_ORIGIN if a custom HTTPS domain is adopted.

databases:
  - name: alraesy-preview-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: tijara_preview
    user: tijara_preview
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []
