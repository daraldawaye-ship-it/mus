name: Item list compact scrolling filters
on:
  pull_request:
    paths:
      - 'apps/web/src/pages/ItemOptionsListPage.tsx'
      - 'apps/web/src/styles.css'
      - 'tests/item-list-compact-scroll-filters.test.ts'
      - '.github/workflows/item-list-compact-scroll-filters-ci.yml'
jobs:
  filters-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/item-list-compact-scroll-filters.test.ts
