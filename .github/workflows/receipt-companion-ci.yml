name: Receipt companion vouchers
on:
  pull_request:
    paths:
      - 'apps/api/migrations/095_optional_receipt_vouchers.sql'
      - 'apps/api/src/services/receipt-extra-voucher.ts'
      - 'apps/api/src/services/pouch-receipts.ts'
      - 'apps/api/src/services/electronic-receipts.ts'
      - 'apps/api/src/routes-commerce.ts'
      - 'apps/web/src/pages/PouchReceiptsPage.tsx'
      - 'tests/receipt-voucher.test.ts'
      - '.github/workflows/receipt-companion-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion-vouchers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Transfer-plus-voucher integration
        run: node --import tsx --test tests/receipt-voucher.test.ts
