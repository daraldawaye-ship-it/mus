# Review this configuration and approve the displayed bill before creating resources.
# Set PREVIEW_ACCESS_PASSWORD securely in DigitalOcean; keep its value out of Git.
name: alraesy-private-preview
disable_edge_cache: true
services:
  - name: preview-web
    github:
      repo: daraldawaye-ship-it/mus
      branch: preview/digitalocean-2026-10-23
      deploy_on_push: false
    source_dir: .
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 3000
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
      success_threshold: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${preview-db.DATABASE_URL}
      - key: APP_ORIGIN
        scope: RUN_TIME
        type: GENERAL
        value: ${APP_URL}
      - key: PREVIEW_ACCESS_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ""
databases:
  - name: preview-db
    engine: PG
    production: false
ingress:
  rules:
    - component:
        name: preview-web
        preserve_path_prefix: "true"
      match:
        path:
          prefix: /
