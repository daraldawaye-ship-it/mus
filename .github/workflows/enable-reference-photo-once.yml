name: Enable reference-card photo editing
on:
  push:
    branches: [preview/render-2026-10-23]
    paths: [.github/workflows/enable-reference-photo-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preview/render-2026-10-23
      - name: Enable only the administrative photo field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path=Path('apps/web/src/pages/MedicineMarketPage.tsx')
          if subprocess.check_output(['git','hash-object',str(path)],text=True).strip()!='54de801c2833c47ca56fe4bc2d5591d8cf6ed5c6':
            raise SystemExit('Concurrent UI edit; inspect first')
          source=path.read_text()
          old='canEdit={!!permissions?.canContribute&&!isMarketAdministrativeKind(card.kind)&&!card.archived}'
          new='canEdit={!!permissions?.canContribute&&!card.archived&&(!isMarketAdministrativeKind(card.kind)||(field.key==="image"&&!!permissions?.canConfigure))}'
          if source.count(old)!=1: raise SystemExit('Unique photo permission anchor missing')
          path.write_text(source.replace(old,new,1))
          PY
          git diff --check
          git rm -- .github/workflows/enable-reference-photo-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/src/pages/MedicineMarketPage.tsx
          git commit -m 'fix(market): enable image editing on administrative reference cards'
          git push origin HEAD:preview/render-2026-10-23
