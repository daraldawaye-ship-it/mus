name: Stock adjustment card sync checks
on:
  pull_request:
    paths:
      - 'packages/contracts/src/inventory.ts'
      - 'apps/api/src/routes-inventory.ts'
      - 'apps/web/src/pages/InventoryPages.tsx'
      - 'apps/web/src/pages/ItemsPages.tsx'
      - 'apps/web/src/pages/CommercePages.tsx'
      - 'apps/web/src/InvoiceItemActionSheets.tsx'
      - 'tests/commerce.test.ts'
      - '.github/workflows/adjustment-card-sync-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adjustment-card:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Auto-cost and linked item card fields
        run: node --import tsx --test --test-name-pattern="adjustment auto-prices from the item card" tests/commerce.test.ts
