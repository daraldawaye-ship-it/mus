name: Stocktake Due Rules CI
on:
  push:
    branches:
      - preview/render-2026-10-23
    paths:
      - "apps/api/src/services/settlement-due.ts"
      - "apps/api/src/routes-settlement-follow-up.ts"
      - "tests/settlement-due-minimum.test.ts"
      - ".github/workflows/settlement-due-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stocktake-due:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/settlement-due-minimum.test.ts
