name: Apply market contribution autosave once
on:
  push:
    branches: [preview/render-2026-10-23]
    paths: [.github/workflows/apply-market-autosave-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preview/render-2026-10-23
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply reviewed field-only changes with concurrency guards
        run: |
          python3 scripts/apply-market-autosave.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/browser-market-autosave.ts')
          source=path.read_text()
          source=source.replace('assert.ok(address&&typeof address!=="string");','assert.ok(address&&typeof address!=="string");\nconst testOrigin=`http://127.0.0.1:${address.port}`;')
          source=source.replace('`http://127.0.0.1:${address.port}/autosave-test.html?field=${field}`','`${testOrigin}/autosave-test.html?field=${field}`')
          path.write_text(source)
          PY
      - name: Verify types and automatic-save interactions without live writes
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
          npx tsx tests/browser-market-autosave.ts
          git diff --check
      - name: Commit only verified field changes
        run: |
          git rm -- .github/workflows/apply-market-autosave-once.yml scripts/apply-market-autosave.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/src/pages/MedicineMarketPage.tsx apps/web/src/MarketImageUpload.tsx docs/MARKET_CONTRIBUTION_AUTOSAVE.md tests/browser-market-autosave.ts
          git commit -m 'feat(market): save all card contributions automatically without a save button'
          git push origin HEAD:preview/render-2026-10-23
