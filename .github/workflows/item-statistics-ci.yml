name: Item statistics regression

on:
  pull_request:
    paths:
      - 'apps/api/migrations/070_incremental_item_statistics.sql'
      - 'apps/api/migrations/071_item_source_supplier.sql'
      - 'apps/api/migrations/072_legacy_supplier_inference.sql'
      - 'apps/api/src/services/item-statistics.ts'
      - 'apps/web/src/pages/ItemsPages.tsx'
      - 'tests/api.test.ts'
      - 'tests/item-coverage.test.ts'
      - '.github/workflows/item-statistics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  item-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      TZ: Asia/Aden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify pooled first-unit stock and cross-page coverage sorting
        run: node --import tsx --test tests/item-coverage.test.ts tests/sale-stock-quantity.test.ts
      - name: Verify stock statistics and source supplier attribution in Aden timezone
        run: node --import tsx --test --test-name-pattern="item statistics track|item source supplier can" tests/api.test.ts
