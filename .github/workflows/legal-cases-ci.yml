name: Legal Cases CI
on:
  push:
    branches:
      - preview/render-2026-10-23
  pull_request:
    paths:
      - "apps/api/src/routes-legal-cases.ts"
      - "apps/api/migrations/118_legal_case_management.sql"
      - "apps/web/src/pages/LegalCasesPage.tsx"
      - "apps/web/src/pages/LegalCasesPage.css"
      - "packages/contracts/src/pages.ts"
      - "packages/contracts/src/index.ts"
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: legal_test_password
          POSTGRES_USER: postgres
          POSTGRES_DB: legal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:legal_test_password@127.0.0.1:5432/legal_ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx tsx --test tests/legal-cases.test.ts
