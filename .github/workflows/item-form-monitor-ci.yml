name: Item and composition form matching
on:
  push:
    branches: ['preview/render-2026-10-23']
    paths:
      - 'apps/api/src/routes-items.ts'
      - 'apps/api/src/services/item-clearance-notices.ts'
      - 'apps/api/src/services/item-clearance-notification-worker.ts'
      - 'apps/web/src/pages/ItemsPages.tsx'
      - 'packages/contracts/src/items.ts'
      - 'tests/item-card-field-concurrency.test.ts'
      - 'tests/item-clearance-independent-fields.test.ts'
      - 'tests/item-clearance-notifications.test.ts'
      - '.github/workflows/item-form-monitor-ci.yml'
  pull_request:
    paths:
      - 'apps/api/migrations/099_product_form_classification.sql'
      - 'apps/api/migrations/20261101_clearance_independent_fields.sql'
      - 'apps/api/src/routes-items.ts'
      - 'apps/api/src/repositories/items.ts'
      - 'apps/api/src/services/items.ts'
      - 'apps/api/src/services/pages.ts'
      - 'apps/api/src/services/permission-rules.ts'
      - 'apps/web/src/pages/ItemsPages.tsx'
      - 'apps/web/src/pages/ItemCompositionsPage.tsx'
      - 'apps/web/src/pages/ItemFormDifferencesPage.tsx'
      - 'apps/web/src/App.tsx'
      - 'packages/contracts/src/items.ts'
      - 'packages/contracts/src/pages.ts'
      - 'tests/commerce.test.ts'
      - 'tests/item-clearance-independent-fields.test.ts'
      - '.github/workflows/item-form-monitor-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  item-form-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Item composition classification and company-scoped mismatch report
        run: node --import tsx --test --test-name-pattern="product form choices are independent" tests/commerce.test.ts
      - name: Independent clearance field persistence, eligibility and conflict regression
        run: node --import tsx --test tests/item-clearance-independent-fields.test.ts
      - name: Item-card field saving and clearance-notification regression
        run: node --import tsx --test tests/item-card-field-concurrency.test.ts tests/item-clearance-notifications.test.ts
