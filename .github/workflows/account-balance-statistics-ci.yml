name: Account statistics, reports and cards

on:
  pull_request:
    paths:
      - "apps/api/migrations/**"
      - "apps/api/src/**"
      - "apps/web/src/**"
      - "packages/contracts/src/**"
      - "tests/account-balance-statistics.test.ts"
      - "tests/account-activity-statistics.test.ts"
      - "tests/account-activity-upgrade.test.ts"
      - "tests/account-stock-value.test.ts"
      - "tests/account-statistics-foundation.test.ts"
      - "tests/account-statistics-report.test.ts"
      - "tests/browser-account-statistics.ts"
      - "tests/transaction-reset.test.ts"
      - ".github/workflows/account-balance-statistics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balances:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNT_BALANCE_STATISTICS_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      ACCOUNT_STATISTICS_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      ACCOUNT_ACTIVITY_STATISTICS_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      ACCOUNT_STOCK_VALUE_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      ACCOUNT_STATISTICS_REPORT_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      ACCOUNT_STATISTICS_BROWSER_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      TRANSACTION_RESET_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      TZ: Asia/Aden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install the focused browser suite's Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Select the installed Chromium executable
        run: |
          node --input-type=module <<'NODE'
          import { accessSync, appendFileSync, constants } from "node:fs";
          import { chromium } from "playwright";
          const executable = chromium.executablePath();
          accessSync(executable, constants.X_OK);
          appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_PATH=${executable}\n`);
          NODE
      - run: npm run check
      - run: npm run build
      - name: Verify history, periods, stock valuation, report projections, authorization and upgrades
        run: node --import tsx --test --test-concurrency=1 tests/account-statistics-foundation.test.ts tests/account-balance-statistics.test.ts tests/account-activity-statistics.test.ts tests/account-activity-upgrade.test.ts tests/account-stock-value.test.ts tests/account-statistics-report.test.ts
      - name: Verify the account statistics table and account card in the browser
        run: node --import tsx tests/browser-account-statistics.ts
      - name: Verify resets preserve protected operational history and exact receipts
        run: node --import tsx --test tests/transaction-reset.test.ts
