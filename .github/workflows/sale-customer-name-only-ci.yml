name: Sales Customer Name-Only CI
on:
  pull_request:
    paths:
      - "packages/contracts/src/commerce.ts"
      - "apps/api/src/services/commerce.ts"
      - "apps/web/src/pages/CommercePages.tsx"
      - "apps/web/src/InvoicePrintSheet.tsx"
      - "tests/sale-customer-name-only.test.ts"
      - ".github/workflows/sale-customer-name-only-ci.yml"
  push:
    branches:
      - preview/render-2026-10-23
    paths:
      - "packages/contracts/src/commerce.ts"
      - "apps/api/src/services/commerce.ts"
      - "apps/web/src/pages/CommercePages.tsx"
      - "apps/web/src/InvoicePrintSheet.tsx"
      - "tests/sale-customer-name-only.test.ts"
      - ".github/workflows/sale-customer-name-only-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sale-customer-name:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/sale-customer-name-only.test.ts
