name: Account balance and activity statistics

on:
  pull_request:
    paths:
      - "apps/api/migrations/**"
      - "apps/api/src/**"
      - "packages/contracts/src/**"
      - "tests/account-balance-statistics.test.ts"
      - "tests/account-activity-statistics.test.ts"
      - "tests/account-activity-upgrade.test.ts"
      - "tests/account-statistics-foundation.test.ts"
      - ".github/workflows/account-balance-statistics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balances:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNT_BALANCE_STATISTICS_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      ACCOUNT_STATISTICS_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      ACCOUNT_ACTIVITY_STATISTICS_TEST_DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
      TZ: Asia/Aden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify history, periods, source deduplication, authorization and upgrades
        run: node --import tsx --test tests/account-statistics-foundation.test.ts tests/account-balance-statistics.test.ts tests/account-activity-statistics.test.ts tests/account-activity-upgrade.test.ts
