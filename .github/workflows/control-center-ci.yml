name: Control center foundation

on:
  pull_request:
    paths:
      - 'apps/api/migrations/073_control_center.sql'
      - 'apps/api/migrations/074_attendance_control_snapshot.sql'
      - 'apps/api/src/services/control-values.ts'
      - 'apps/api/src/routes-commerce.ts'
      - 'apps/api/src/routes-finance.ts'
      - 'apps/api/src/routes-attendance.ts'
      - 'apps/api/src/services/attendance-rewards.ts'
      - 'apps/api/src/services/attendance-notifications.ts'
      - 'apps/web/src/pages/CommercePages.tsx'
      - 'apps/web/src/invoice-clearance-label.ts'
      - 'tests/invoice-clearance-label.test.ts'
      - 'apps/web/src/pages/FinancePages.tsx'
      - 'apps/web/src/WalletIndicator.tsx'
      - 'apps/web/src/control.ts'
      - 'apps/web/src/idle-logout.ts'
      - 'apps/api/src/routes-control.ts'
      - 'apps/api/src/services/control-catalog.ts'
      - 'apps/api/src/services/pages.ts'
      - 'apps/api/src/services/permission-rules.ts'
      - 'apps/api/src/business-routes.ts'
      - 'apps/web/src/pages/ControlPage.tsx'
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/UserShortcuts.tsx'
      - 'apps/web/src/UserMenu.tsx'
      - 'apps/web/src/EntityMenuSearch.tsx'
      - 'apps/web/src/recent-entities.ts'
      - 'apps/web/src/phase2.tsx'
      - 'apps/web/src/pages/AccountsPage.tsx'
      - 'apps/web/src/pages/CompanyPages.tsx'
      - 'apps/web/src/pages/ItemsPages.tsx'
      - 'tests/recent-entities.test.ts'
      - 'apps/web/src/UserShortcutMenuGrid.tsx'
      - 'apps/web/src/user-menu-tabs.css'
      - 'tests/browser.ts'
      - 'apps/web/src/shortcut-position.ts'
      - 'tests/shortcut-position.test.ts'
      - 'apps/web/src/last-company-activation.ts'
      - 'apps/web/src/styles.css'
      - 'tests/last-company-activation.test.ts'
      - 'apps/web/src/pages/GeneralTablePage.tsx'
      - 'apps/api/src/routes-general-table.ts'
      - 'tests/api.test.ts'
      - 'packages/contracts/src/pages.ts'
      - 'packages/contracts/src/index.ts'
      - 'tests/control.test.ts'
      - 'tests/items.test.ts'
      - 'apps/api/src/routes-settlement-follow-up.ts'
      - 'apps/api/migrations/112_item_negative_stock_projection.sql'
      - 'apps/api/migrations/113_item_ordering_stock_projection.sql'
      - 'apps/web/src/pages/SettlementFollowUpPage.tsx'
      - '.github/workflows/control-center-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Sales search clearance rate and dated campaign visibility
        run: node --import tsx --test tests/invoice-clearance-label.test.ts
      - name: Item card field audit and revision regression
        run: node --import tsx --test --test-name-pattern="item field audit records" tests/items.test.ts
      - name: Requested stocktake timestamp and inventory count importance
        run: node --import tsx --test --test-name-pattern="item stocktake request is server-stamped" tests/items.test.ts
      - name: Scoped option value and permission tests
        run: node --import tsx --test tests/control.test.ts
      - name: Persist last visited company across rapid public-page navigation
        run: node --import tsx --test tests/last-company-activation.test.ts
      - name: Recent selections remain scoped by company and user
        run: node --import tsx --test tests/recent-entities.test.ts
      - name: Keep user shortcut flyout inside viewport in RTL and narrow layouts
        run: node --import tsx --test tests/shortcut-position.test.ts
      - name: General table numeric inline edit and sort regressions
        run: node --import tsx --test --test-name-pattern="general table numeric columns sort" tests/api.test.ts
      - name: General table inline title update and data-preservation checks
        run: node --import tsx --test --test-name-pattern="general table inline title edit preserves" tests/api.test.ts
