name: Mobile shortcut single tap
on:
  pull_request:
    paths:
      - 'apps/web/src/UserShortcuts.tsx'
      - 'apps/web/src/shortcut-position.ts'
      - 'tests/shortcut-position.test.ts'
      - 'tests/browser-pages.ts'
      - '.github/workflows/mobile-shortcuts-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-shortcut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify real mouse hover and touch no-hover regression
        run: node --import tsx --test tests/shortcut-position.test.ts
