name: Selling notes and alternatives guidance
on:
  pull_request:
    paths:
      - 'apps/api/migrations/098_sale_notes_item_composition.sql'
      - 'apps/api/src/routes-commerce.ts'
      - 'apps/api/src/routes-items.ts'
      - 'apps/api/src/services/items.ts'
      - 'apps/api/src/repositories/items.ts'
      - 'apps/api/src/services/control-catalog.ts'
      - 'packages/contracts/src/items.ts'
      - 'apps/web/src/InvoiceSaleAlerts.tsx'
      - 'apps/web/src/pages/ItemsPages.tsx'
      - 'apps/web/src/pages/ItemCompositionsPage.tsx'
      - 'apps/web/src/pages/CommercePages.tsx'
      - 'apps/web/src/styles.css'
      - 'tests/commerce.test.ts'
      - '.github/workflows/sale-guidance-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sale-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Sale notes and near-expiry threshold in company scope
        run: node --import tsx --test --test-name-pattern="sale alerts include item" tests/commerce.test.ts
