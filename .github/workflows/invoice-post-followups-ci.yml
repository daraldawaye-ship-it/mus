name: Invoice follow-ups and print readiness
on:
  pull_request:
    paths:
      - 'apps/api/src/services/invoice-post-followups.ts'
      - 'apps/api/src/services/commerce.ts'
      - 'apps/api/migrations/169_invoice_post_followups.sql'
      - 'apps/web/src/pages/CommercePages.tsx'
      - 'apps/web/src/CompanyPrintHeader.tsx'
      - 'tests/commerce.test.ts'
      - '.github/workflows/invoice-post-followups-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  invoice-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijara_test
          POSTGRES_PASSWORD: tijara_test
          POSTGRES_DB: tijara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tijara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijara_test:tijara_test@localhost:5432/tijara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Test durable invoice rewards and clearance
        run: node --import tsx --test --test-name-pattern="invoice follow-ups are deferred|invoice reward tasks are opt-in|clearance earnings credit saver only|foreign-currency clearance is posted" tests/commerce.test.ts
      - name: Check invoice print columns
        run: node --import tsx --test tests/invoice-print-sheet.test.ts
