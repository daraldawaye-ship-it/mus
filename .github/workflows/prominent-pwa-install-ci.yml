name: Prominent PWA install invitation checks
on:
  pull_request:
    paths:
      - 'apps/web/src/InstallBanner.tsx'
      - 'apps/web/src/AppSetup.tsx'
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/styles.css'
      - 'apps/web/src/app-install.ts'
      - 'apps/web/public/site.webmanifest'
      - 'tests/pwa-link-launch.test.ts'
      - 'apps/web/src/QuickLoginPage.tsx'
      - 'tests/prominent-pwa-install-banner.test.ts'
      - '.github/workflows/prominent-pwa-install-ci.yml'
jobs:
  install-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/app-install.test.ts tests/prominent-pwa-install-banner.test.ts tests/pwa-link-launch.test.ts tests/user-magic-link-login.test.ts
