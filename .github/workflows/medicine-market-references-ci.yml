name: Market reference cards and pharmacy directory CI
on:
  push:
    branches: [preview/render-2026-10-23]
    paths:
      - "packages/contracts/src/medicine-market.ts"
      - "apps/api/market-migrations/**"
      - "apps/api/src/routes-medicine-market.ts"
      - "apps/web/src/pages/MedicineMarketPage.tsx"
      - "tests/medicine-market-reference-pharmacies.test.ts"
      - ".github/workflows/medicine-market-references-ci.yml"
  pull_request:
    paths:
      - "packages/contracts/src/medicine-market.ts"
      - "apps/api/market-migrations/**"
      - "apps/api/src/routes-medicine-market.ts"
      - "apps/web/src/pages/MedicineMarketPage.tsx"
      - "tests/medicine-market-reference-pharmacies.test.ts"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/market_test
      MARKET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/market_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --import tsx --test tests/medicine-market-reference-pharmacies.test.ts
      - run: node --import tsx --test tests/medicine-market-isolation.test.ts tests/medicine-market-native.test.ts
      - run: docker build -f Dockerfile.market -t alraesy-market-check .
